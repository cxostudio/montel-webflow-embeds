<!-- Montel · Forecasting & analytics hero visual. Place inside the hero's right column. -->
<div class="mtl-fa" data-mtl-fa>
  <div class="mtl-fa__canvas">
    <svg class="mtl-fa__back" viewBox="0 0 1080 640" aria-hidden="true"></svg>

    <article class="mtl-fa__card mtl-fa__card--sm" data-h="0" style="--x:0px;--y:300px;--w:190px;--h:175px;--dot:#9fb2af">
      <div class="mtl-fa__top"><h3 class="mtl-fa__t">Historical</h3><span class="mtl-fa__tag">Analyse</span></div>
      <p class="mtl-fa__m">30+ years of prices</p>
      <svg preserveAspectRatio="none" class="mtl-fa__chart" data-chart="history" viewBox="0 0 124 52"></svg>
    </article>

    <article class="mtl-fa__card" data-h="1" style="--x:205px;--y:225px;--w:285px;--h:240px;--dot:#1a9f82">
      <div class="mtl-fa__top"><h3 class="mtl-fa__t">Live &amp; intraday</h3><span class="mtl-fa__tag">Trade</span></div>
      <div class="mtl-fa__meta"><p class="mtl-fa__m">Balancing · weather</p><span class="mtl-fa__live"><i></i>15 min</span></div>
      <svg preserveAspectRatio="none" class="mtl-fa__chart" data-chart="intraday" viewBox="0 0 208 100"></svg>
    </article>

    <article class="mtl-fa__card mtl-fa__card--sm" data-h="2" style="--x:505px;--y:360px;--w:210px;--h:150px;--dot:#3fae96">
      <div class="mtl-fa__top"><h3 class="mtl-fa__t">Short-term</h3><span class="mtl-fa__tag">Plan</span></div>
      <p class="mtl-fa__m">Demand &amp; generation</p>
      <svg preserveAspectRatio="none" class="mtl-fa__chart" data-chart="days" viewBox="0 0 149 40"></svg>
    </article>

    <article class="mtl-fa__card" data-h="3" style="--x:505px;--y:105px;--w:290px;--h:230px;--dot:#4f8fc4">
      <div class="mtl-fa__top"><h3 class="mtl-fa__t">Months ahead</h3><span class="mtl-fa__tag">Hedge</span></div>
      <p class="mtl-fa__m">Fuels, hydrology &amp; fundamentals</p>
      <svg preserveAspectRatio="none" class="mtl-fa__chart" data-chart="months" viewBox="0 0 213 90"></svg>
    </article>

    <article class="mtl-fa__card mtl-fa__card--purple" data-h="4" style="--x:810px;--y:10px;--w:270px;--h:220px;--dot:#6a2ff6">
      <div class="mtl-fa__top"><h3 class="mtl-fa__t">To 2060</h3><span class="mtl-fa__tag">Invest</span></div>
      <p class="mtl-fa__scn">Central scenario</p>
      <svg preserveAspectRatio="none" class="mtl-fa__chart" data-chart="long" viewBox="0 0 243 78"></svg>
      <div class="mtl-fa__x"><span>2030</span><span>2060</span></div>
    </article>
  </div>
</div>

<script>
$(document).ready(function () {

  const $menuItems = $('.header__menu_item');

  function closeMenus() {
    $menuItems.each(function () {
      const $item = $(this);

      $item.removeClass('is-open');
      $item.find('.header__menu_link').first().attr('aria-expanded', 'false');
      $item.find('.header__menu_dropdown').first().hide();
    });
  }

  function openMenu($item) {
    closeMenus();

    $item.addClass('is-open');
    $item.find('.header__menu_dropdown').first().show();
    $item.find('.header__menu_link').first().attr('aria-expanded', 'true');
  }

  function enableMenu() {

    $menuItems.each(function () {
      const $item = $(this);
      const $trigger = $item.find('.header__menu_link').first();
      const $dropdown = $item.find('.header__menu_dropdown').first();

      $trigger.attr({
        'aria-expanded': 'false',
        'aria-haspopup': 'true'
      });

      $dropdown.hide();
    });

    $menuItems.on('mouseenter.desktopMenu', function () {
      if (window.matchMedia('(hover: hover)').matches) {
        openMenu($(this));
      }
    });

    $menuItems.on('mouseleave.desktopMenu', function () {
      if (
        window.matchMedia('(hover: hover)').matches &&
        !$(this).find(':focus').length
      ) {
        closeMenus();
      }
    });

    $menuItems.find('.header__menu_link').on('click.desktopMenu', function (e) {
      e.preventDefault();

      const $item = $(this).closest('.header__menu_item');
      const isOpen = $item.hasClass('is-open');

      closeMenus();

      if (!isOpen) {
        openMenu($item);
      }
    });

    $menuItems.on('keydown.desktopMenu', function (e) {
      if (e.key === 'Escape') {
        closeMenus();
        $(this).find('.header__menu_link').first().trigger('focus');
      }
    });

    $(document).on('click.desktopMenu', function (e) {
      if (!$(e.target).closest('.header__menu').length) {
        closeMenus();
      }
    });

    $(document).on('focusin.desktopMenu', function (e) {
      if (!$(e.target).closest('.header__menu').length) {
        closeMenus();
      }
    });
  }

  function disableMenu() {
    closeMenus();

    $menuItems.off('.desktopMenu');
    $menuItems.find('.header__menu_link').off('.desktopMenu');

    $(document).off('.desktopMenu');

    $menuItems.find('.header__menu_dropdown').css('display', '');
    $menuItems.find('.header__menu_link').removeAttr('aria-expanded aria-haspopup');
  }

  function checkScreenSize() {
    if (window.innerWidth >= 1280) {
      if (!$menuItems.first().data('desktop-menu-active')) {
        enableMenu();
        $menuItems.data('desktop-menu-active', true);
      }
    } else {
      if ($menuItems.first().data('desktop-menu-active')) {
        disableMenu();
        $menuItems.removeData('desktop-menu-active');
      }
    }
  }

  checkScreenSize();

  $(window).on('resize', checkScreenSize);

});
</script>

<script>  
$(document).ready(function () {
  if ($('.hero__tab').length) {

    var $buttons = $('.hero__tab_button');
    var $arts = $('.hero__tab_content > *');
    var $prev = $('.hero__tab_nav_button[data-button="left"]');
    var $next = $('.hero__tab_nav_button[data-button="right"]');

    var currentIndex = 0;
    var autoPlay;
    var duration = 7000;

    function showTab(index) {

      // Keep index within range
      index = (index + $buttons.length) % $buttons.length;

      $buttons.removeClass('active');
      $arts.removeClass('active').hide();

      // Reset all progress bars
      $('.hero__tab_button__progress')
        .stop(true, true)
        .css('clip-path', 'inset(0 100% 0 0)');

      var $activeButton = $buttons.eq(index);
      var $activeArt = $arts.eq(index);

      $activeButton.addClass('active');

      $activeArt
        .show()
        .addClass('active');

      // Animate progress bar
      $activeButton.find('.hero__tab_button__progress')
        .css('dummy', 0)
        .animate(
          { dummy: 100 },
          {
            duration: duration,
            easing: 'linear',
            step: function (now) {
              $(this).css(
                'clip-path',
                `inset(0 ${100 - now}% 0 0)`
              );
            }
          }
        );

      currentIndex = index;

      // Refresh ScrollTrigger
      if (window.ScrollTrigger) {
        ScrollTrigger.refresh();
      }
    }

    function startAutoPlay() {
      clearInterval(autoPlay);

      autoPlay = setInterval(function () {
        showTab(currentIndex + 1);
      }, duration);
    }

    function navigateTo(index) {
      clearInterval(autoPlay);

      showTab(index);

      startAutoPlay();
    }

    // Tab button click
    $buttons.on('click', function () {
      var index = $buttons.index(this);
      navigateTo(index);
    });

    // Previous arrow click
    $prev.on('click', function () {
      navigateTo(currentIndex - 1);
    });

    // Next arrow click
    $next.on('click', function () {
      navigateTo(currentIndex + 1);
    });

    // Initialize
    showTab(0);
    startAutoPlay();

  }
});
</script>

<script>
    $(function () {

        var $slider = $('.newsroom__list');
        if (!$slider.length) return;

        var count = $slider.children().length;

        if (count % 2) {
            $slider.append($slider.children().clone());
            count *= 2;
        }

        $slider.on('init reInit setPosition', function () {
            if (!count) return;
            $slider.find('.slick-slide').each(function (domIndex) {
                var raw = $(this).attr('data-slick-index');
                var i = (raw === undefined || raw === null || raw === '') ? domIndex : parseInt(raw, 10);
                if (isNaN(i)) i = domIndex;
                var k = ((i % count) + count) % count;
                $(this)
                    .toggleClass('slide-even', k % 2 === 1)
                    .toggleClass('slide-odd', k % 2 === 0);
            });
        });

        $slider.slick({
            slidesToShow: 3,
            slidesToScroll: 1,
            autoplay: false,
            autoplaySpeed: 20000,
            speed: 700,
            cssEase: 'cubic-bezier(.22,.61,.36,1)',
            arrows: false,
            dots: false,
            infinite: true,
            swipeToSlide: true,
            pauseOnHover: true,
            pauseOnFocus: true,
            responsive: [
              {
                breakpoint: 768,
                settings: {
                  slidesToShow: 1,
                  slidesToScroll: 1
                }
              }
            ]
        });

        if (window.IntersectionObserver) {
            new IntersectionObserver(function (entries) {
                $slider.slick(entries[0].isIntersecting ? 'slickPlay' : 'slickPause');
            }, { threshold: 0.25 }).observe($slider[0]);
        } else {
            $slider.slick('slickPlay');
        }

        if (window.ResizeObserver) {
            var lastWidth = $slider.width();
            new ResizeObserver(function (entries) {
                var w = Math.round(entries[0].contentRect.width);
                if (!w || w === lastWidth) return;
                var wokeFromZero = !lastWidth;
                lastWidth = w;
                if (wokeFromZero) {
                    $(window).trigger('resize');
                } else {
                    $slider.slick('setPosition');
                }
            }).observe($slider[0]);
        }

        $(window).on('load', function () {
            $slider.slick('setPosition');
        });

    });
</script>

<script>
$(document).ready(function () {

    const $items = $('.eco2__body_list > .eco2__body_item');
    const $left = $('.eco2__arrow button[data-button="left"]');
    const $right = $('.eco2__arrow button[data-button="right"]');
    const $progress = $('.eco2_progress_m');
    const $navList = $('.eco2__nav_list');
    const $navItems = $navList.children('.eco2__nav_item');

    let currentIndex = 0;
    let autoplay;
    let isMobile = window.innerWidth < 768;

    const delay = 4000;

    function showItem() {

        $items.stop(true, true).hide()
            .eq(currentIndex).fadeIn(300);

        $left.prop('disabled', currentIndex === 0);
        $right.prop('disabled', currentIndex === $items.length - 1);

        $navItems.removeClass('active');
        $navItems.eq(currentIndex).addClass('active');

        animateProgress();
        updateNavPosition();

    }

    function animateProgress() {

        const totalItems = $items.length;

        if (!totalItems) return;

        const progress = ((currentIndex + 1) / totalItems) * 100;

        $progress.css({
            'transition': 'width 0.3s ease',
            'width': progress + '%'
        });

    }

    function updateNavPosition() {

        const totalItems = $navItems.length;

        if (!totalItems) return;

        const parentWidth = $navList.parent().innerWidth();
        const listWidth = $navList[0].scrollWidth;

        let offset = 0;

        if (currentIndex === 0) {

            offset = 0;

        } else if (currentIndex === totalItems - 1) {

            offset = parentWidth - listWidth;

        } else {

            const $activeItem = $navItems.eq(currentIndex);

            const itemLeft = $activeItem[0].offsetLeft;
            const itemWidth = $activeItem.outerWidth();

            offset = (parentWidth / 2) - (itemLeft + itemWidth / 2);

        }

        $navList.css('transform', `translate3d(${offset}px, 0, 0)`);

    }

    function nextItem() {

        if (currentIndex < $items.length - 1) {
            currentIndex++;
            showItem();
        }

    }

    function prevItem() {

        if (currentIndex > 0) {
            currentIndex--;
            showItem();
        }

    }

    function startAutoplay() {

        stopAutoplay();

        if ($items.length > 1 && currentIndex < $items.length - 1) {

            autoplay = setInterval(function () {

                nextItem();

                if (currentIndex === $items.length - 1) {
                    stopAutoplay();
                }

            }, delay);

        }

    }

    function stopAutoplay() {
        clearInterval(autoplay);
    }

    function initEcoSlider() {

        isMobile = window.innerWidth < 768;

        stopAutoplay();

        if (isMobile) {

            $navItems.off('click.ecoSlider').on('click.ecoSlider', function () {

                currentIndex = $navItems.index(this);

                showItem();
                startAutoplay();

            });

            $right.off('click.ecoSlider').on('click.ecoSlider', function () {

                if (currentIndex === $items.length - 1) return;

                nextItem();
                startAutoplay();

            });

            $left.off('click.ecoSlider').on('click.ecoSlider', function () {

                if (currentIndex === 0) return;

                prevItem();
                startAutoplay();

            });

            showItem();
            startAutoplay();

        } else {

            $navItems.off('click.ecoSlider');
            $left.off('click.ecoSlider');
            $right.off('click.ecoSlider');

            $items.stop(true, true).show();

            $left.prop('disabled', false);
            $right.prop('disabled', false);

            $progress.css({
                'transition': 'none',
                'width': '0%'
            });

            $navItems.removeClass('active');
            $navList.css('transform', 'translateX(0)');

        }

    }

    $(window).on('resize', function () {
        initEcoSlider();
    });

    initEcoSlider();

});
</script>


<script>
$(document).ready(function () {
  $('.ecosystem__horizon_cards').each(function () {
    var $container = $(this);
    var $cards = $container.find('.ecosystem__horizon_card');
    var currentGroup = 0;
    var timer;
    var intervalTime = 8000;
    var isAnimating = false;

    if ($cards.length >= 4) {

      function getGroup(group) {
        var start = group * 2;
        return $cards.eq(start).add($cards.eq(start + 1));
      }

      function showGroup(group) {
        if (isAnimating) return;

        isAnimating = true;

        var $currentCards = getGroup(currentGroup);
        var $nextCards = getGroup(group);

        // Fade current cards out smoothly
        $currentCards.stop(true, true).fadeTo(1200, 0, function () {

          // Hide them completely
          $currentCards.hide();

          // Prepare next cards
          $nextCards
            .stop(true, true)
            .css('opacity', 0)
            .show();

          // Slowly fade next cards in
          $nextCards.animate(
            { opacity: 1 },
            {
              duration: 2000,
              easing: 'swing',
              complete: function () {
                isAnimating = false;
                currentGroup = group;
              }
            }
          );
        });
      }

      function startCarousel() {
        clearInterval(timer);

        timer = setInterval(function () {
          var nextGroup = currentGroup === 0 ? 1 : 0;
          showGroup(nextGroup);
        }, intervalTime);
      }

      function stopCarousel() {
        clearInterval(timer);
      }

      // Initial state
      $cards.hide();
      getGroup(0).show().css('opacity', 1);

      startCarousel();

      $container.on('mouseenter', stopCarousel);
      $container.on('mouseleave', startCarousel);
    }
  });
});
</script>

<script>

function initEcosystemAnimation() {
  if (typeof gsap === "undefined" ||
      typeof ScrollTrigger === "undefined") {
    console.error("GSAP or ScrollTrigger is not loaded.");
    return;
  }

  gsap.registerPlugin(ScrollTrigger);

  const ecosystem = document.querySelector(".ecosystem__animation");
  if (!ecosystem) return;

  const content = ecosystem.querySelector(".ecosystem__content");
  if (!content) return;

  const boxes = gsap.utils.toArray(".ecosystem__box", content);
  const navButtons = gsap.utils.toArray(
    ".ecosystem__nav_item_button"
  );
  const progressLine = ecosystem.querySelector(
    ".ecosystem__progress_line"
  );

  function setActive(index) {
    navButtons.forEach((button, i) => {
      button.classList.toggle("active", i <= index);
    });
  }

  const getDistance = () =>
    Math.max(0, content.scrollHeight - window.innerHeight);

  gsap.set(content, { y: 0 });

  ScrollTrigger.create({
    trigger: ecosystem,
    start: "top top",
    end: () => `+=${getDistance()}`,
    pin: true,
    scrub: 1,
    invalidateOnRefresh: true,

    onUpdate: (self) => {
      const distance = getDistance();

      gsap.set(content, {
        y: -distance * self.progress,
      });

      if (progressLine) {
        progressLine.style.height =
          `${self.progress * 100}%`;
      }

      const sectionRect = ecosystem.getBoundingClientRect();
      const center = ecosystem.clientHeight / 2;

      let activeIndex = 0;
      let closestDistance = Infinity;

      boxes.forEach((box, index) => {
        const rect = box.getBoundingClientRect();
        const boxCenter =
          rect.top - sectionRect.top + rect.height / 2;

        const distanceFromCenter = Math.abs(boxCenter - center);

        if (distanceFromCenter < closestDistance) {
          closestDistance = distanceFromCenter;
          activeIndex = index;
        }
      });

      setActive(activeIndex);
    },
  });

  setActive(0);

  ScrollTrigger.refresh();

  window.addEventListener("resize", () => {
    ScrollTrigger.refresh();
  });
}

// Wait for the complete page load, including images and other resources.
if (document.readyState === "complete") {
  initEcosystemAnimation();
} else {
  window.addEventListener("load", initEcosystemAnimation, {
    once: true,
  });
}

</script>

  var initialItems = 9;
  var loadMoreItems = 6;
  $items.hide();
  $items.slice(0, initialItems).show();
  if ($items.length <= initialItems) {
    if ($watchPrevious.length) {
      $loadMore.hide();
    } else {
      $buttonContainer.hide();
    }
  }
  $loadMore.on('click', function (e) {
    e.preventDefault();
    var $hiddenItems = $items.filter(':hidden');
    $hiddenItems.slice(0, loadMoreItems).slideDown();
    if ($items.filter(':hidden').length === 0) {
      if ($watchPrevious.length) {
        $loadMore.hide();
      } else {
        $buttonContainer.hide();
      }
    }
  });
});
</script>

<script>
$(function () {
    const $window = $(window);
    const $header = $('.header');
    const $breadcrumb = $('.detail_breadcrub_progress');
    const $article = $('.detail_article');
    const $progress = $('.detail_progress');
    const $fill = $('.detail_progress__fill');
    const $count = $('.detail_progress__count');

    function updateProgress() {
        if (!$article.length || !$fill.length || !$count.length) return;

        const headerHeight = $header.outerHeight() || 0;
        const breadcrumbHeight = $breadcrumb.outerHeight() || 0;
        const viewportHeight = $window.height();

        const articleTop = $article.offset().top;
        const articleBottom = articleTop + $article.outerHeight();

        const start = articleTop - headerHeight - breadcrumbHeight;
        const end = articleBottom - viewportHeight;

        let progress = ((window.scrollY - start) / (end - start)) * 100;

        progress = Math.max(0, Math.min(100, progress));

        $fill.css(
            'clip-path',
            `inset(0 ${100 - progress}% 0 0)`
        );

        $count.text(`${Math.round(progress)}%`);

        const progressWidth = $progress.outerWidth();
        const countWidth = $count.outerWidth();

        let left = (progressWidth * progress) / 100;

        left = Math.max(
            countWidth / 2,
            Math.min(progressWidth - countWidth / 2, left)
        );

        $count.css({
            left: `${left}px`
        });
    }

    $window.on('scroll resize', updateProgress);

    updateProgress();
});
</script>

<script>
$(document).ready(function () {
    var $links = $('.detail_conf_nav__link');
    var isClickScrolling = false;

    $links.each(function () {
      var href = $(this).data('href');
      if (!$('#' + href).length) {
          $(this).remove();
      }
  });

    function getScrollOffset() {
        return ($('.header').outerHeight() || 0) +
               ($('.detail_conf_nav').outerHeight() || 0);
    }

    function getTarget(link) {
        var href = $(link).attr('data-href') || $(link).attr('href');
        return href ? href.replace(/^#/, '') : '';
    }

    function setActiveLink(target) {
        $links.removeClass('active');

        $links.filter(function () {
            return getTarget(this) === target;
        }).addClass('active');
    }

    function scrollToSection(target, animate) {
        var $section = $('#' + target);

        if (!$section.length) return;

        var top = Math.max(
            0,
            $section.offset().top - getScrollOffset()
        );

        $('html, body').stop(true);

        if (animate) {
            isClickScrolling = true;

            $('html, body').animate({
                scrollTop: top
            }, 600, 'swing', function () {
                // Wait until both html and body finish animating.
                if ($('html, body').is(':animated')) return;

                isClickScrolling = false;
                updateActiveLink();
            });
        } else {
            $('html, body').scrollTop(top);
        }
    }

    function updateActiveLink() {
        // Prevent scroll events from overriding a clicked link.
        if (isClickScrolling) return;

        var scrollPosition =
            $(window).scrollTop() + getScrollOffset();

        var activeTarget = '';

        $links.each(function () {
            var target = getTarget(this);
            var $section = $('#' + target);

            if (!$section.length) return;

            var top = $section.offset().top - 10;
            var bottom = top + $section.outerHeight();

            // Active only when the scroll position is inside the section.
            if (scrollPosition >= top && scrollPosition < bottom) {
                activeTarget = target;
            }
        });

        if (activeTarget) {
            setActiveLink(activeTarget);
        } else {
            $links.removeClass('active');
        }
    }

    // Handle navigation clicks.
    $links.on('click', function (e) {
        e.preventDefault();

      	if($('.detail_conf_outer_course').length > 0) {
          $('.detail_conf__form').hide();
          $('.detail_conf__info_body').show();
        } 

        var target = getTarget(this);

        if (!target || !$('#' + target).length) return;

        var url = new URL(window.location.href);
        url.searchParams.set('tab', target);

        window.history.replaceState({}, '', url.toString());

        // Activate immediately before scrolling.
        setActiveLink(target);

        scrollToSection(target, true);
    });

    // Update active link during manual scrolling.
    $(window).on('scroll', function () {
        updateActiveLink();
    });

    // Recalculate positions after resizing.
    $(window).on('resize', function () {
        updateActiveLink();
    });

    // Initialize navigation using the URL parameter.
    function initializeNavigation() {
        var tab = new URLSearchParams(
            window.location.search
        ).get('tab');

        if (tab && $('#' + tab).length) {
            setActiveLink(tab);
            scrollToSection(tab, false);
        } else {
            updateActiveLink();
        }
    }

    // Initialize once the page has loaded.
    if (document.readyState === 'complete') {
        initializeNavigation();
    } else {
        $(window).one('load', initializeNavigation);
    }
});
</script>

<script>

function initNewsletterSidebar() {
    var $sidebar = $('.newsletter_detail__sidebar_links');
    var $headings = $('.newsletter_detail__body h2');

    if (!$sidebar.length || !$headings.length) return;

    $sidebar.empty();

    $headings.each(function (index) {
        var $heading = $(this);
        var title = $.trim($heading.text());

        var id = title
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-|-$/g, '');

        if ($headings.filter(function () {
            return this.id === id;
        }).length > 1) {
            id += '-' + index;
        }

        $heading.attr('id', id);

        $('<button>', {
            type: 'button',
            text: title,
            class: 'newsletter_sidebar_link',
            'data-href': '#' + id
        }).appendTo($sidebar);
    });
}

$(document).ready(function () {
    initNewsletterSidebar();

    function getScrollOffset() {
        return ($('.header').outerHeight() || 0) + 60;
    }

    $(document).on('click', '.newsletter_sidebar_link', function () {
        var target = $(this).attr('data-href');
        var $target = $(target);

        if (!$target.length) return;

        $('html, body').stop().animate({
            scrollTop: $target.offset().top - getScrollOffset()
        }, 500);

        history.replaceState(null, '', target);
    });

    function updateActiveLink() {
        var scrollPosition = $(window).scrollTop();
        var offset = getScrollOffset() + 20;
        var activeId = '';

        $('.newsletter_detail__body h2').each(function () {
            if ($(this).offset().top <= scrollPosition + offset) {
                activeId = this.id;
            }
        });

        if ($(window).scrollTop() + $(window).height() >= $(document).height() - 5) {
            activeId = $('.newsletter_detail__body h2').last().attr('id');
        }

        $('.newsletter_sidebar_link').removeClass('active');

        if (activeId) {
            $('.newsletter_sidebar_link').filter(function () {
                return $(this).attr('data-href') === '#' + activeId;
            }).addClass('active');
        }
    }

    $(window).on('scroll resize load', updateActiveLink);

    updateActiveLink();

    $(window).on('load', function () {
        updateActiveLink();

        setTimeout(updateActiveLink, 300);
    });
});

</script>

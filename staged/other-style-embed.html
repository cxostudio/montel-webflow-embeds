  .ecosystem__horizon_card::before {
    content: "";

    inset: 0;
    padding: 1px;

    background: linear-gradient(var(--horizon-angle), rgba(128, 203, 211, 0.15) 10%, #C2BDFF 55%, rgba(128, 203, 211, 0.15) 90% );
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
	-webkit-mask-composite: xor;
    mask-composite: exclude;
	pointer-events: none;
    transition: transform 0.8s ease;
  }
  .ecosystem__horizon_card:hover::before {
    animation: horizonAngleRotate 2s linear infinite;
  }
  @keyframes horizonAngleRotate {
      from {
          --horizon-angle: 90deg;
      }
  
      to {
          --horizon-angle: 360deg;
      }
  }
